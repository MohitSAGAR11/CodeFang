# Render Blueprint for the CodeFang web playground (one Docker service = API + web UI).
# Dashboard -> New -> Blueprint -> pick this repo. Secrets marked `sync: false`
# are prompted for in the dashboard and never live in the repo.
services:
  - type: web
    name: codefang-playground
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: NODE_ENV
        value: production
